<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>每日签到领Token – 鸭鸭数学</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet"/>
  <!-- 2026-08-28: AdSense 合规修法 —— 原来的"看15秒倒计时广告换Token"是
       incentivized-ads(激励式广告),Google AdSense 政策明确禁止把奖励跟广告
       观看行为绑定,是账号封禁级风险(LANDING_PAGE_CRO_ADSENSE_AUDIT.md
       Top-1)。这个页面从来没有真的接入过 <ins class="adsbygoogle">(只是占位
       壳),但倒计时+"观看进度"UI 本身就是问题所在,不是"等审核通过再接真广告
       就没事"。改成跟广告完全无关的"每日签到"奖励:立即可领,不用等待/不用
       观看任何东西,每天限领1次(原限额5次/天,DB 字段复用 ad_views_today/
       ad_views_date,语义改成签到日期/签到次数)。跟 React 端 TokenShopPage
       的 AdPlaceholderCard("即将推出",按钮禁用)口径一致——两边都不做"看
       广告直接领 token"的假激励模式。文件名保留 watch-ad.html 不改
       (student.py/utils.py 里的 Streamlit 旧端硬编码链接到这个文件名,改名
       会需要同步改 Streamlit 代码,不在这次范围内)。 -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="f094d0f5-d0c9-40aa-ae4e-1326a65605b6"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans SC',sans-serif;background:#f0f4ff;
         display:flex;flex-direction:column;align-items:center;
         min-height:100vh;padding:24px 16px;}

    .card{background:#fff;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.10);
          width:100%;max-width:480px;padding:32px 28px;margin-top:16px;}

    /* Header */
    .logo{text-align:center;margin-bottom:20px;}
    .logo-duck{font-size:3rem;}
    .logo-name{font-size:1.3rem;font-weight:900;color:#1e40af;margin-top:4px;}
    .logo-sub{font-size:0.8rem;color:#6b7280;margin-top:2px;}

    /* Check-in icon area (replaces old ad-slot placeholder) */
    .checkin-slot{background:linear-gradient(135deg,#e0e7ff,#dbeafe);
             border-radius:16px;
             min-height:160px;display:flex;flex-direction:column;
             align-items:center;justify-content:center;
             padding:20px;margin-bottom:24px;position:relative;text-align:center;}
    .checkin-icon{font-size:3rem;margin-bottom:8px;}
    .checkin-text{font-size:0.85rem;color:#3b82f6;font-weight:600;}
    .checkin-sub{font-size:0.72rem;color:#6b7280;margin-top:4px;}

    /* Status */
    .status{text-align:center;margin-bottom:20px;}
    .status-msg{font-size:0.85rem;color:#6b7280;margin-top:4px;line-height:1.5;}

    /* Buttons */
    .btn{width:100%;padding:14px;border:none;border-radius:14px;
         font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;}
    .btn-claim{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;}
    .btn-claim:hover{opacity:.9;transform:translateY(-1px);}
    .btn-claim:disabled{background:#d1d5db;color:#9ca3af;cursor:not-allowed;transform:none;}
    .btn-close{background:#f3f4f6;color:#374151;margin-top:10px;}
    .btn-close:hover{background:#e5e7eb;}

    /* Success state */
    .success-card{display:none;text-align:center;}
    .success-icon{font-size:4rem;margin-bottom:12px;}
    .success-title{font-size:1.4rem;font-weight:900;color:#059669;margin-bottom:8px;}
    .success-msg{font-size:0.85rem;color:#6b7280;line-height:1.5;margin-bottom:20px;}

    /* Error */
    .error-msg{color:#dc2626;font-size:0.82rem;text-align:center;
               margin-bottom:12px;display:none;}

    /* Limit reached */
    .limit-card{display:none;text-align:center;}
    .limit-icon{font-size:3rem;margin-bottom:10px;}
    .limit-title{font-size:1.1rem;font-weight:700;color:#d97706;margin-bottom:6px;}
    .limit-msg{font-size:0.82rem;color:#6b7280;line-height:1.5;}

    /* Footer */
    .footer{text-align:center;font-size:0.72rem;color:#9ca3af;margin-top:20px;}
    .footer a{color:#6b7280;text-decoration:none;}
  </style>
</head>
<body>

<div class="card" id="mainCard">
  <!-- Logo -->
  <div class="logo">
    <div class="logo-duck">🦆</div>
    <div class="logo-name" id="logoName">鸭鸭数学 · DuckMath</div>
    <div class="logo-sub" id="logoSub">每日签到，领取练习 Token</div>
  </div>

  <!-- Check-in area (no ad, no wait) -->
  <div class="checkin-slot" id="checkinSlot">
    <div class="checkin-icon">🗓️</div>
    <div class="checkin-text" id="checkinText">每日签到</div>
    <div class="checkin-sub" id="checkinSub">
      每天登入签到一次即可领取，不需要观看任何广告<br/>
      感谢你的支持！🦆
    </div>
  </div>

  <!-- Status -->
  <div class="status">
    <div class="status-msg" id="statusMsg">检查签到状态中…</div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Claim button -->
  <button class="btn btn-claim" id="claimBtn" disabled onclick="claimTokens()">
    ⏳ 加载中…
  </button>
  <button class="btn btn-close" onclick="closeOrReturn()" style="margin-top:10px;" id="closeBtn">
    ✖ 稍后再来
  </button>
</div>

<!-- Success state -->
<div class="card success-card" id="successCard">
  <div class="success-icon">🎉</div>
  <div class="success-title" id="successTitle">+5 Token 领取成功！</div>
  <div class="success-msg" id="successMsg">
    感谢你每日签到支持鸭鸭数学！<br/>
    你的支持让更多马来西亚独中生能免费练习数学。
  </div>
  <div style="background:#f0fdf4;border-radius:12px;padding:14px;margin-bottom:20px;text-align:center;">
    <div style="font-size:2rem;">⚡</div>
    <div style="font-weight:700;color:#059669;font-size:1rem;" id="newBalance">Token 已到账</div>
  </div>
  <button class="btn btn-claim" onclick="closeOrReturn()">
    ← 返回继续练习
  </button>
</div>

<!-- Limit reached -->
<div class="card limit-card" id="limitCard">
  <div class="limit-icon">✅</div>
  <div class="limit-title" id="limitTitle">今日已签到</div>
  <div class="limit-msg" id="limitMsg">
    你今天已经签到过了，明天再来吧！<br/><br/>
    还可以通过购买 Token 继续练习。
  </div>
  <button class="btn btn-close" onclick="closeOrReturn()" style="margin-top:20px;">
    ← 返回 App
  </button>
</div>

<div class="footer">
  <a href="index.html">鸭鸭数学 DuckMath</a> ·
  <a href="privacy.html">隐私政策</a> ·
  © 2025 TinkTech Sdn Bhd
</div>

<script>
// ══ Config ═══════════════════════════════════════════════════════════════════
const SUPABASE_URL     = 'https://ghnrxawknlszjvleonam.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdobnJ4YXdrbmxzemp2bGVvbmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyOTAzMDQsImV4cCI6MjA5MDg2NjMwNH0.axP0TiD_YZvCJRKv2QlQm5nu-v0UUn9aho3kZOWrJg8';
const TOKENS_PER_CHECKIN = 5;   // 每日签到奖励(原 TOKENS_PER_AD,已跟广告无关)
const CHECKIN_DAILY_LIMIT = 1;  // 原 AD_DAILY_LIMIT=5(可看5次广告),改成每天限领1次
const RETURN_URL       = 'https://uecstudent.streamlit.app'; // 2026-08-28: 故意不跟着 CTA 切——watch-ad.html 目前只从 Streamlit 旧端(pages/student.py)打开,用户的登入 session 在那边,不在新端;'返回'应该送他们回到还登着的那个 app,不是丢到新端一个陌生的登入页(新旧端不共享浏览器本地登入态,只共享同一个 Supabase 数据库)。

// ══ Parse URL params ══════════════════════════════════════════════════════════
const params = new URLSearchParams(window.location.search);
const AT      = params.get('at')   || '';   // Supabase access token
const UID     = params.get('uid')  || '';   // user id
const LANG    = params.get('lang') || 'zh'; // zh | en

// ══ i18n ═════════════════════════════════════════════════════════════════════
const i18n = {
  zh: {
    logoSub:        '每日签到，领取练习 Token',
    checkinText:    '每日签到',
    checkinSub:     '每天登入签到一次即可领取，不需要观看任何广告\n感谢你的支持！🦆',
    loadingMsg:     '检查签到状态中…',
    claimReady:     '🎁 领取 +{n} Token！',
    loading:        '⏳ 加载中…',
    closeBtn:       '✖ 稍后再来',
    successTitle:   '+{n} Token 领取成功！',
    successMsg:     '感谢你每日签到支持鸭鸭数学！\n你的支持让更多马来西亚独中生能免费练习数学。',
    newBalance:     '新余额：{b} Token',
    limitTitle:     '今日已签到',
    limitMsg:       '你今天已经签到过了，明天再来吧！',
    returnBtn:      '← 返回继续练习',
    errInvalid:     '❌ 无效的登入状态，请重新登入后再试。',
    errLimit:       '❌ 今日签到奖励已领取。',
    errNetwork:     '❌ 网络错误，请稍后重试。',
  },
  en: {
    logoSub:        'Daily check-in for practice Tokens',
    checkinText:    'Daily Check-in',
    checkinSub:     'Check in once a day to claim — no ads to watch.\nThank you for supporting DuckMath! 🦆',
    loadingMsg:     'Checking status…',
    claimReady:     '🎁 Claim +{n} Tokens!',
    loading:        '⏳ Loading…',
    closeBtn:       '✖ Not now',
    successTitle:   '+{n} Tokens Claimed!',
    successMsg:     'Thank you for checking in and supporting DuckMath!\nYour support keeps the platform free for Malaysian students.',
    newBalance:     'New balance: {b} Tokens',
    limitTitle:     'Already checked in today',
    limitMsg:       "You've already checked in today. Come back tomorrow!",
    returnBtn:      '← Back to Practice',
    errInvalid:     '❌ Invalid session. Please log in again.',
    errLimit:       '❌ Daily check-in reward already claimed.',
    errNetwork:     '❌ Network error. Please try again later.',
  },
};
const T = i18n[LANG] || i18n.zh;

function tx(key, vars = {}) {
  let s = T[key] || key;
  for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
  return s;
}

// ══ Apply language ════════════════════════════════════════════════════════════
document.getElementById('logoSub').textContent    = T.logoSub;
document.getElementById('checkinText').textContent = T.checkinText;
document.getElementById('checkinSub').innerHTML   = T.checkinSub.replace('\n','<br/>');
document.getElementById('statusMsg').textContent  = T.loadingMsg;
document.getElementById('claimBtn').textContent   = T.loading;
document.getElementById('closeBtn').textContent   = T.closeBtn;
document.getElementById('successMsg').innerHTML   = T.successMsg.replace('\n','<br/>');
document.getElementById('successTitle').textContent = tx('successTitle', {n: TOKENS_PER_CHECKIN});
document.getElementById('limitTitle').textContent = T.limitTitle;
document.getElementById('limitMsg').innerHTML     = T.limitMsg.replace('\n','<br/>');
document.documentElement.lang = LANG;

// ══ Supabase helpers ══════════════════════════════════════════════════════════
function sbHeaders(withAuth = true) {
  const h = { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
  if (withAuth && AT) h['Authorization'] = `Bearer ${AT}`;
  return h;
}

async function getProfile() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/profiles?id=eq.${UID}&select=tokens_daily,tokens_purchased,ad_views_today,ad_views_date`,
    { headers: sbHeaders() }
  );
  if (!res.ok) throw new Error('fetch_profile_failed');
  const data = await res.json();
  return data[0] || null;
}

async function updateProfile(patch) {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/profiles?id=eq.${UID}`,
    { method: 'PATCH', headers: { ...sbHeaders(), 'Prefer': 'return=minimal' },
      body: JSON.stringify(patch) }
  );
  if (!res.ok) throw new Error('update_failed');
}

// ══ State ════════════════════════════════════════════════════════════════════
let claiming = false;

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function closeOrReturn() {
  window.close();
  // If window.close() is blocked (e.g. not opened by script), redirect
  setTimeout(() => { window.location.href = RETURN_URL; }, 400);
}

// ══ Validate session + check daily limit, then enable claim immediately ══════
// (2026-08-28 合规修法:去掉了原来的15秒倒计时/观看进度——不再要求"看完广告"
// 才能领,校验完当天没领过就直接可以点。)
async function init() {
  if (!AT || !UID) {
    showError(T.errInvalid);
    document.getElementById('claimBtn').disabled = true;
    document.getElementById('statusMsg').textContent = '';
    return;
  }
  try {
    const profile = await getProfile();
    if (!profile) { showError(T.errInvalid); return; }

    const today = new Date().toISOString().slice(0, 10);
    const checkinDate  = profile.ad_views_date  || '';
    const checkedInToday = checkinDate === today ? (profile.ad_views_today || 0) : 0;

    if (checkedInToday >= CHECKIN_DAILY_LIMIT) {
      // Already checked in today
      document.getElementById('mainCard').style.display = 'none';
      document.getElementById('limitCard').style.display = 'block';
      return;
    }

    // Not checked in yet today — enable claim immediately, no wait.
    document.getElementById('statusMsg').textContent = '';
    const claimBtn = document.getElementById('claimBtn');
    claimBtn.disabled = false;
    claimBtn.textContent = tx('claimReady', {n: TOKENS_PER_CHECKIN});
  } catch (e) {
    showError(T.errNetwork);
  }
}

// ══ Claim tokens ══════════════════════════════════════════════════════════════
async function claimTokens() {
  if (claiming) return;
  claiming = true;

  const claimBtn = document.getElementById('claimBtn');
  claimBtn.disabled    = true;
  claimBtn.textContent = LANG === 'zh' ? '处理中…' : 'Processing…';
  document.getElementById('errorMsg').style.display = 'none';

  try {
    const profile = await getProfile();
    if (!profile) { showError(T.errInvalid); claiming = false; return; }

    const today = new Date().toISOString().slice(0, 10);
    const checkinDate  = profile.ad_views_date  || '';
    const checkedInToday = checkinDate === today ? (profile.ad_views_today || 0) : 0;

    if (checkedInToday >= CHECKIN_DAILY_LIMIT) {
      showError(T.errLimit);
      claiming = false;
      return;
    }

    const newTokens = (profile.tokens_daily || 0) + TOKENS_PER_CHECKIN;
    const newCheckins = checkedInToday + 1;

    await updateProfile({
      tokens_daily:   newTokens,
      ad_views_today: newCheckins,
      ad_views_date:  today,
    });

    // Show success
    document.getElementById('mainCard').style.display    = 'none';
    document.getElementById('successCard').style.display = 'block';
    const total = newTokens + (profile.tokens_purchased || 0);
    document.getElementById('newBalance').textContent = tx('newBalance', {b: total});
    document.getElementById('successTitle').textContent  = tx('successTitle', {n: TOKENS_PER_CHECKIN});
    document.querySelector('#successCard .btn-claim').textContent = T.returnBtn;

  } catch (e) {
    showError(T.errNetwork);
    claimBtn.disabled    = false;
    claimBtn.textContent = tx('claimReady', {n: TOKENS_PER_CHECKIN});
    claiming = false;
  }
}

// ══ Boot ═════════════════════════════════════════════════════════════════════
init();
</script>
</body>
</html>
